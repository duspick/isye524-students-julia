name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Julia 1.12 environment and clean notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GKSwstype: "100"
      JULIA_NUM_THREADS: auto

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Julia 1.12
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Restore Julia package cache
        uses: julia-actions/cache@v3
        with:
          delete-old-caches: false

      - name: Instantiate course environment
        run: julia --startup-file=no --project=. scripts/setup.jl

      - name: Reject notebooks with saved outputs
        run: julia --startup-file=no --project=. scripts/notebook_hygiene.jl --check

      - name: Test notebook cleaning and attachment preservation
        run: julia --startup-file=no --project=. test/notebook_hygiene.jl

      - name: Execute assignment starter notebooks
        run: julia --startup-file=no --project=. test/assignment_notebooks.jl

      - name: Run course environment smoke tests
        run: julia --startup-file=no --project=. test/smoke.jl
